<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Deliveries · BOMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="/BOMS-EVAgas/assets/css/pages/deliverer-deliveries.css" rel="stylesheet" />
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main class="main-content">

    <div class="header-row">
      <div>
        <h1 class="page-title">My Deliveries</h1>
        <p class="page-subtitle" id="deliveryDate"></p>
      </div>
      <button onclick="loadDeliveries()" style="padding:.5rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--mist);font-family:'Sora',sans-serif;font-size:.8rem;cursor:pointer;">
        <span data-icon="refresh" aria-hidden="true"></span> Refresh
      </button>
    </div>

    <!-- Status filter tabs -->
    <!-- data-status values match ENUM values in DB exactly -->
    <div class="status-tabs">
      <button class="status-tab active" data-status="all"        onclick="filterByStatus('all')">All</button>
      <button class="status-tab"        data-status="Pending"    onclick="filterByStatus('Pending')"><span data-icon="clock" aria-hidden="true"></span> Pending</button>
      <button class="status-tab"        data-status="On the way" onclick="filterByStatus('On the way')"><span data-icon="truck" aria-hidden="true"></span> On the way</button>
      <button class="status-tab"        data-status="Delivered"  onclick="filterByStatus('Delivered')"><span data-icon="check" aria-hidden="true"></span> Delivered</button>
    </div>

    <!-- Cards render here -->
    <div class="delivery-cards" id="deliveryCards">
      <div class="empty-state">
        <div class="empty-icon" data-icon="package" aria-hidden="true"></div>
        <div>Loading deliveries...</div>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/icons.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/mobile-navigation.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar_deliverer.js"></script>
<script src="/BOMS-EVAgas/assets/js/deliverer/deliveries.js"></script>
</body>
</html>
