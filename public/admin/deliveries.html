<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deliveries · BOMS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --flame:#FF4B1F;--amber:#FF9F0A;--ink:#0F0E0C;--card:#1E1C19;
      --border:rgba(255,255,255,.07);--mist:#9E9B92;--cream:#F5F0E8;
      --white:#fff;--green:#34C759;--red:#FF3B30;--blue:#5AC8FA;
    }
    html,body{height:100%;font-family:'Sora',sans-serif;background:var(--ink);color:var(--cream);}

    /* Header */
    .header-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;}
    .page-title{font-size:1.55rem;font-weight:700;color:var(--white);}
    .page-subtitle{font-size:.82rem;color:var(--mist);margin-top:.25rem;}

    /* Branch switcher */
    .branch-switcher{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
    .branch-view-badge{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .75rem;border-radius:20px;font-weight:600;}
    .branch-view-badge.own{background:rgba(52,199,89,.12);color:var(--green);border:1px solid rgba(52,199,89,.25);}
    .branch-view-badge.other{background:rgba(255,159,10,.12);color:var(--amber);border:1px solid rgba(255,159,10,.3);}
    .branch-btn{padding:.4rem .9rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--mist);font-family:'Sora',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;}
    .branch-btn:hover{border-color:var(--flame);color:var(--flame);}
    .branch-btn.active{background:rgba(255,75,31,.1);border-color:var(--flame);color:var(--flame);}

    /* Status count badges */
    .status-counts{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem;}
    .count-badge{display:flex;align-items:center;gap:.5rem;padding:.45rem .9rem;border-radius:20px;font-size:.78rem;font-weight:600;border:1px solid;}
    .count-badge.pending{background:rgba(255,159,10,.1);color:var(--amber);border-color:rgba(255,159,10,.25);}
    .count-badge.otw{background:rgba(90,200,250,.1);color:var(--blue);border-color:rgba(90,200,250,.25);}
    .count-badge.delivered{background:rgba(52,199,89,.1);color:var(--green);border-color:rgba(52,199,89,.25);}
    .count-badge.cancelled{background:rgba(255,255,255,.05);color:var(--mist);border-color:var(--border);}
    .count-num{font-family:'Space Mono',monospace;font-size:.85rem;}

    /* Toolbar */
    .toolbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem;}
    .filter-select{padding:.6rem .9rem;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--cream);font-family:'Sora',sans-serif;font-size:.85rem;outline:none;cursor:pointer;}
    .filter-select:focus{border-color:var(--flame);}
    .count-label{font-size:.78rem;color:var(--mist);margin-left:auto;}
    .btn-add{display:flex;align-items:center;gap:.5rem;padding:.65rem 1.2rem;background:linear-gradient(135deg,var(--flame),#FF6B35);border:none;border-radius:10px;color:var(--white);font-family:'Sora',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
    .btn-add:hover{opacity:.85;}

    /* Table */
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .delivery-table{width:100%;border-collapse:collapse;font-size:.85rem;}
    .delivery-table thead th{padding:.85rem 1rem;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);text-align:left;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);}
    .delivery-table tbody td{padding:.9rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
    .delivery-table tbody tr:last-child td{border-bottom:none;}
    .delivery-table tbody tr:hover td{background:rgba(255,255,255,.02);}
    .col-id{width:60px;font-family:'Space Mono',monospace;font-size:.78rem;color:var(--mist);}
    .col-date{width:120px;font-size:.78rem;color:var(--mist);}
    .col-actions{width:150px;}
    .customer-name{font-weight:600;color:var(--cream);}
    .customer-address{font-size:.72rem;color:var(--mist);margin-top:.15rem;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .table-empty{text-align:center;padding:3rem 1rem;color:var(--mist);}

    /* Status badges */
    .status-badge{display:inline-block;padding:.25rem .65rem;border-radius:20px;font-size:.74rem;font-weight:600;}
    .status-pending{background:rgba(255,159,10,.15);color:var(--amber);border:1px solid rgba(255,159,10,.3);}
    .status-otw{background:rgba(90,200,250,.15);color:var(--blue);border:1px solid rgba(90,200,250,.3);}
    .status-delivered{background:rgba(52,199,89,.12);color:var(--green);border:1px solid rgba(52,199,89,.25);}
    .status-cancelled{background:rgba(255,255,255,.05);color:var(--mist);border:1px solid var(--border);}

    /* Action buttons */
    .btn-action{padding:.32rem .75rem;border-radius:7px;border:1px solid;font-family:'Sora',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;margin-right:.35rem;}
    .btn-action.edit{border-color:rgba(90,200,250,.3);color:var(--blue);background:rgba(90,200,250,.08);}
    .btn-action.edit:hover{background:rgba(90,200,250,.18);}
    .btn-action.deliver{border-color:rgba(52,199,89,.3);color:var(--green);background:rgba(52,199,89,.08);}
    .btn-action.deliver:hover{background:rgba(52,199,89,.18);}
    .btn-action.cancel{border-color:rgba(255,59,48,.3);color:var(--red);background:rgba(255,59,48,.08);}
    .btn-action.cancel:hover{background:rgba(255,59,48,.18);}

    /* ── Modals ───────────────────────────────────────── */
    .modal-backdrop{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;}
    .modal-backdrop.open{display:flex;}
    .modal-box{background:#1E1C19;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2rem;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
    .modal-title{font-size:1.1rem;font-weight:700;color:var(--white);}
    .modal-close{background:none;border:none;color:var(--mist);font-size:1.2rem;cursor:pointer;padding:.25rem;line-height:1;transition:color .15s;}
    .modal-close:hover{color:var(--cream);}

    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    .form-field{margin-bottom:1rem;}
    .form-field label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);margin-bottom:.45rem;}
    .field-input{width:100%;padding:.75rem .9rem;background:#141310;border:1px solid var(--border);border-radius:9px;color:var(--cream);font-family:'Sora',sans-serif;font-size:.88rem;outline:none;transition:border-color .15s;}
    .field-input:focus{border-color:var(--flame);}
    .field-input.error{border-color:var(--red);}
    .field-error{font-size:.73rem;color:var(--red);margin-top:.35rem;min-height:1em;}

    .modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem;}
    .btn-cancel-modal{padding:.7rem 1.3rem;background:none;border:1px solid var(--border);border-radius:9px;color:var(--mist);font-family:'Sora',sans-serif;font-size:.88rem;cursor:pointer;transition:all .15s;}
    .btn-cancel-modal:hover{border-color:var(--mist);color:var(--cream);}
    .btn-submit{padding:.7rem 1.5rem;background:linear-gradient(135deg,var(--flame),#FF6B35);border:none;border-radius:9px;color:var(--white);font-family:'Sora',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;}

    /* Confirm cancel modal */
    .modal-box.small{max-width:380px;text-align:center;}
    .confirm-icon{font-size:2.5rem;margin-bottom:.75rem;}
    .confirm-msg{font-size:.9rem;color:var(--cream);line-height:1.6;margin-bottom:1.5rem;}
    .confirm-msg strong{color:var(--white);}
    .btn-confirm-cancel{padding:.7rem 1.5rem;background:var(--red);border:none;border-radius:9px;color:var(--white);font-family:'Sora',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
    .btn-confirm-cancel:disabled{opacity:.5;cursor:not-allowed;}

    /* Toast */
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1.2rem;font-size:.85rem;color:var(--cream);transform:translateY(6px);opacity:0;pointer-events:none;transition:all .25s;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.error{border-color:rgba(255,59,48,.4);color:#FF6B61;}
    .toast.success{border-color:rgba(52,199,89,.3);color:var(--green);}

    @media(max-width:640px){.form-row{grid-template-columns:1fr;}.col-date,.col-id{display:none;}}
  </style>
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main class="main-content">

    <!-- Page header -->
    <div class="header-row">
      <div>
        <h1 class="page-title">Deliveries</h1>
        <p class="page-subtitle">Manage and track all deliveries</p>
      </div>
      <div class="branch-switcher">
        <span id="viewingBadge" class="branch-view-badge own">Branch A (your branch)</span>
        <button class="branch-btn active" data-branch="1" onclick="switchBranch(1)">Branch A</button>
        <button class="branch-btn"        data-branch="2" onclick="switchBranch(2)">Branch B</button>
      </div>
    </div>

    <!-- Status count badges -->
    <!-- IDs: countPending, countOnTheWay, countDelivered, countCancelled -->
    <div class="status-counts">
      <div class="count-badge pending">
        <span>🕐 Pending</span>
        <span class="count-num" id="countPending">0</span>
      </div>
      <div class="count-badge otw">
        <span>🚴 On the way</span>
        <span class="count-num" id="countOnTheWay">0</span>
      </div>
      <div class="count-badge delivered">
        <span>✅ Delivered</span>
        <span class="count-num" id="countDelivered">0</span>
      </div>
      <div class="count-badge cancelled">
        <span>✕ Cancelled</span>
        <span class="count-num" id="countCancelled">0</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <select id="statusFilter" class="filter-select" onchange="loadDeliveries()">
        <option value="all">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="On the way">On the way</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <span class="count-label" id="deliveryCount"></span>
      <button class="btn-add" id="addDeliveryBtn" onclick="openAddModal()">
        ＋ New Delivery
      </button>
    </div>

    <!-- Table -->
    <div class="card">
      <table class="delivery-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Assigned To</th>
            <th>Status</th>
            <th class="col-date">Date</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="deliveryTableBody">
          <tr><td colspan="7" class="table-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- ── Add / Edit Delivery Modal ──────────────────────────── -->
<!-- IDs used by deliveries.js: deliveryModal, modalTitle, submitBtn,
     fieldCustomerName, fieldCustomerPhone, fieldCustomerAddress,
     fieldProductId, fieldQuantity, fieldAssignedTo, fieldNotes,
     errCustomerName, errCustomerAddress, errProductId, errQuantity -->
<div class="modal-backdrop" id="deliveryModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">New Delivery</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <form onsubmit="return false;">
      <!-- Customer Name + Phone -->
      <div class="form-row">
        <div class="form-field">
          <label for="fieldCustomerName">Customer Name *</label>
          <input type="text" id="fieldCustomerName" class="field-input"
                 placeholder="Full name" />
          <div class="field-error" id="errCustomerName"></div>
        </div>
        <div class="form-field">
          <label for="fieldCustomerPhone">Phone Number</label>
          <input type="tel" id="fieldCustomerPhone" class="field-input"
                 placeholder="09xx-xxx-xxxx" />
        </div>
      </div>

      <!-- Address (full width) -->
      <div class="form-field">
        <label for="fieldCustomerAddress">Delivery Address *</label>
        <input type="text" id="fieldCustomerAddress" class="field-input"
               placeholder="Street, Barangay, Municipality" />
        <div class="field-error" id="errCustomerAddress"></div>
      </div>

      <!-- Product + Quantity -->
      <div class="form-row">
        <div class="form-field">
          <label for="fieldProductId">Product *</label>
          <select id="fieldProductId" class="field-input">
            <option value="">-- Select Product --</option>
          </select>
          <div class="field-error" id="errProductId"></div>
        </div>
        <div class="form-field">
          <label for="fieldQuantity">Quantity *</label>
          <input type="number" id="fieldQuantity" class="field-input"
                 placeholder="1" min="1" value="1" />
          <div class="field-error" id="errQuantity"></div>
        </div>
      </div>

      <!-- Assigned To -->
      <div class="form-field">
        <label for="fieldAssignedTo">Assign To (Deliverer)</label>
        <select id="fieldAssignedTo" class="field-input">
          <option value="">-- Unassigned --</option>
        </select>
      </div>

      <!-- Notes -->
      <div class="form-field">
        <label for="fieldNotes">Notes (optional)</label>
        <input type="text" id="fieldNotes" class="field-input"
               placeholder="Special instructions, landmarks, etc." />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel-modal" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn-submit" id="submitBtn" onclick="handleSubmit()">
          Create Delivery
        </button>
      </div>
    </form>

  </div>
</div>

<!-- ── Cancel Confirmation Modal ──────────────────────────── -->
<!-- IDs used by deliveries.js: cancelModal, cancelDeliveryName, confirmCancelBtn -->
<div class="modal-backdrop" id="cancelModal">
  <div class="modal-box small">
    <div class="confirm-icon">⚠️</div>
    <p class="confirm-msg">
      Cancel delivery for<br />
      <strong id="cancelDeliveryName"></strong>?<br />
      <small style="color:var(--mist);">This cannot be undone.</small>
    </p>
    <div style="display:flex;gap:.75rem;justify-content:center;">
      <button class="btn-cancel-modal" onclick="closeCancelModal()">Go Back</button>
      <button class="btn-confirm-cancel" id="confirmCancelBtn" onclick="executeCancel()">
        Yes, Cancel It
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Script load order -->
<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar.js"></script>
<script src="/BOMS-EVAgas/assets/js/admin/deliveries.js"></script>
</body>
</html>
