<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · BOMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link href="/BOMS-EVAgas/assets/css/pages/admin-products.css" rel="stylesheet" />
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>

<div class="layout">

  <!-- Sidebar renders here -->
  <div id="sidebar"></div>

  <!-- ── Main Content ───────────────────────────────────── -->
  <main class="main-content">

    <!-- Page header -->
    <div class="header-row">
      <div>
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle">Manage LPG products and stock levels</p>
      </div>

      <!-- Branch toggle -->
      <div class="branch-switcher">
        <span id="viewingBadge" class="branch-view-badge own">Branch A (your branch)</span>
        <button class="branch-btn active" data-branch="1" onclick="switchBranch(1)">Branch A</button>
        <button class="branch-btn"        data-branch="2" onclick="switchBranch(2)">Branch B</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon" data-icon="search" aria-hidden="true"></span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search products..."
          oninput="onSearch()"
        />
      </div>

      <select id="statusFilter" class="filter-select" onchange="loadProducts()">
        <option value="Active">Active only</option>
        <option value="Inactive">Inactive only</option>
        <option value="all">All products</option>
      </select>

      <span class="count-label" id="productCount">— products</span>

      <button class="btn-add" id="addProductBtn" onclick="openAddModal()">
        ＋ Add Product
      </button>
    </div>

    <!-- Products table -->
    <div class="card">
      <table class="products-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Product Name</th>
            <th class="col-price">Price</th>
            <th class="col-stock">Stock</th>
            <th class="col-status">Status</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <tr><td colspan="6" class="table-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- ── Add / Edit Product Modal ──────────────────────────── -->
<div class="modal-backdrop" id="productModal">
  <div class="modal-box">

    <form id="productForm" onsubmit="return false;">

    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Add New Product</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <!-- Product Name (full width) -->
    <div class="form-field">
      <label for="productName">Product Name</label>
      <input type="text" id="productName" class="field-input" placeholder="e.g. LPG 11kg Cylinder" />
      <div class="field-error" id="productNameError"></div>
    </div>

    <!-- Category -->
    <div class="form-field">
      <label for="productCategory">Category</label>
      <select id="productCategory" class="field-input">
        <option value="LPG Cylinder">LPG Cylinder</option>
        <option value="Accessories">Accessories</option>
        <option value="General">General</option>
      </select>
    </div>

    <!-- Price + Stock (two columns) -->
    <div class="form-row">
      <div class="form-field">
        <label for="productPrice">Price (₱)</label>
        <input type="number" id="productPrice" class="field-input" placeholder="0.00" min="0" step="0.01" />
        <div class="field-error" id="productPriceError"></div>
      </div>
      <div class="form-field">
        <label for="productStock">Stock (units)</label>
        <input type="number" id="productStock" class="field-input" placeholder="0" min="0" />
        <div class="field-error" id="productStockError"></div>
      </div>
    </div>

    <!-- Status (only shown when editing) -->
    <div class="form-field" id="statusRow" style="display:none;">
      <label for="productStatus">Status</label>
      <select id="productStatus" class="field-input">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">Add Product</button>
    </div>

    </form>

  </div>
</div>

<!-- ── Delete Confirmation Modal ──────────────────────────── -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal-box delete-box">
    <div class="delete-icon" data-icon="trash" aria-hidden="true"></div>
    <p class="delete-msg">
      Remove <strong id="deleteProductName"></strong>?<br />
      This will mark the product as Inactive.<br />
      <small style="color:var(--mist);">Past sales records will not be affected.</small>
    </p>
    <div style="display:flex;gap:.75rem;justify-content:center;">
      <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-confirm-delete" id="confirmDeleteBtn" onclick="executeDelete()">Yes, Remove</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Script order matters -->
<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/icons.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/mobile-navigation.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar.js"></script>
<script src="/BOMS-EVAgas/assets/js/admin/product.js"></script>

</body>
</html>
