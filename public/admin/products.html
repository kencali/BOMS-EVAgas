<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · BOMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & base (same vars as login/dashboard) ──── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --flame:   #FF4B1F;
      --amber:   #FF9F0A;
      --ink:     #0F0E0C;
      --surface: #181714;
      --card:    #1E1C19;
      --border:  rgba(255,255,255,.07);
      --mist:    #9E9B92;
      --cream:   #F5F0E8;
      --white:   #FFFFFF;
      --green:   #34C759;
      --red:     #FF3B30;
      --blue:    #5AC8FA;
    }
    html, body { height: 100%; font-family: 'Sora', sans-serif; background: var(--ink); color: var(--cream); }

    /* ── Header row ──────────────────────────────────── */
    .header-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.75rem;
    }
    .page-title    { font-size: 1.55rem; font-weight: 700; color: var(--white); }
    .page-subtitle { font-size: .82rem; color: var(--mist); margin-top: .25rem; }

    /* Branch switcher */
    .branch-switcher  { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .branch-view-badge {
        font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
        padding: .3rem .75rem; border-radius: 20px; font-weight: 600;
    }
    .branch-view-badge.own   { background: rgba(52,199,89,.12);  color: var(--green); border: 1px solid rgba(52,199,89,.25); }
    .branch-view-badge.other { background: rgba(255,159,10,.12); color: var(--amber); border: 1px solid rgba(255,159,10,.3); }
    .branch-btn {
        padding: .4rem .9rem; border-radius: 8px; border: 1px solid var(--border);
        background: var(--card); color: var(--mist); font-family: 'Sora', sans-serif;
        font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .branch-btn:hover  { border-color: var(--flame); color: var(--flame); }
    .branch-btn.active { background: rgba(255,75,31,.1); border-color: var(--flame); color: var(--flame); }

    /* ── Toolbar (search + filter + add btn) ─────────── */
    .toolbar {
        display: flex;
        align-items: center;
        gap: .75rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
    .search-icon { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: var(--mist); font-size: .85rem; pointer-events: none; }
    .search-input {
        width: 100%; padding: .65rem .85rem .65rem 2.4rem;
        background: var(--card); border: 1px solid var(--border); border-radius: 10px;
        color: var(--cream); font-family: 'Sora', sans-serif; font-size: .88rem; outline: none;
        transition: border-color .15s;
    }
    .search-input::placeholder { color: var(--mist); opacity: .5; }
    .search-input:focus { border-color: var(--flame); }

    .filter-select {
        padding: .65rem .9rem; background: var(--card); border: 1px solid var(--border);
        border-radius: 10px; color: var(--cream); font-family: 'Sora', sans-serif;
        font-size: .85rem; outline: none; cursor: pointer;
    }
    .filter-select:focus { border-color: var(--flame); }

    .count-label { font-size: .78rem; color: var(--mist); margin-left: auto; }

    .btn-add {
        display: flex; align-items: center; gap: .5rem;
        padding: .65rem 1.2rem; background: linear-gradient(135deg, var(--flame), #FF6B35);
        border: none; border-radius: 10px; color: var(--white);
        font-family: 'Sora', sans-serif; font-size: .85rem; font-weight: 600;
        cursor: pointer; transition: opacity .15s;
        white-space: nowrap;
    }
    .btn-add:hover { opacity: .85; }

    /* ── Table card ──────────────────────────────────── */
    .card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; overflow: hidden;
    }

    .products-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .products-table thead th {
        padding: .85rem 1rem; background: rgba(255,255,255,.03);
        border-bottom: 1px solid var(--border); text-align: left;
        font-size: .7rem; font-weight: 600; letter-spacing: .08em;
        text-transform: uppercase; color: var(--mist);
    }
    .products-table tbody td { padding: .9rem 1rem; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; }
    .products-table tbody tr:last-child td { border-bottom: none; }
    .products-table tbody tr:hover td { background: rgba(255,255,255,.02); }

    .col-id     { width: 60px;  color: var(--mist); font-family: 'Space Mono', monospace; font-size: .78rem; }
    .col-price  { width: 120px; }
    .col-stock  { width: 110px; }
    .col-status { width: 90px; }
    .col-actions{ width: 140px; }
    .mono       { font-family: 'Space Mono', monospace; }

    .product-name { font-weight: 600; color: var(--cream); }
    .product-cat  { font-size: .72rem; color: var(--mist); margin-top: .15rem; }

    /* Stock pill */
    .stock-pill {
        display: inline-block; padding: .25rem .65rem;
        border-radius: 20px; font-size: .76rem; font-weight: 600;
        font-family: 'Space Mono', monospace;
    }
    .stock-pill.out  { background: rgba(255,59,48,.15);  color: var(--red);   border: 1px solid rgba(255,59,48,.25); }
    .stock-pill.low  { background: rgba(255,159,10,.15); color: var(--amber); border: 1px solid rgba(255,159,10,.25); }
    .stock-pill.mid  { background: rgba(90,200,250,.1);  color: var(--blue);  border: 1px solid rgba(90,200,250,.2); }
    .stock-pill.good { background: rgba(52,199,89,.1);   color: var(--green); border: 1px solid rgba(52,199,89,.2); }

    /* Status badge */
    .status-badge {
        display: inline-block; padding: .2rem .6rem;
        border-radius: 20px; font-size: .72rem; font-weight: 600;
    }
    .status-badge.active   { background: rgba(52,199,89,.1); color: var(--green); }
    .status-badge.inactive { background: rgba(255,255,255,.06); color: var(--mist); }

    /* Action buttons */
    .btn-action {
        padding: .32rem .75rem; border-radius: 7px; border: 1px solid;
        font-family: 'Sora', sans-serif; font-size: .75rem; font-weight: 600;
        cursor: pointer; transition: all .15s; margin-right: .35rem;
    }
    .btn-action.edit   { border-color: rgba(90,200,250,.3);  color: var(--blue);  background: rgba(90,200,250,.08); }
    .btn-action.edit:hover   { background: rgba(90,200,250,.18); }
    .btn-action.delete { border-color: rgba(255,59,48,.3);   color: var(--red);   background: rgba(255,59,48,.08); }
    .btn-action.delete:hover { background: rgba(255,59,48,.18); }

    .table-empty { text-align: center; padding: 3rem 1rem; color: var(--mist); line-height: 2; }

    /* ── MODAL base ──────────────────────────────────── */
    .modal-backdrop {
        display: none;
        position: fixed; inset: 0; z-index: 100;
        background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
        align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
        background: #1E1C19; border: 1px solid rgba(255,255,255,.1);
        border-radius: 16px; padding: 2rem; width: 100%; max-width: 460px;
        box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }

    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-title  { font-size: 1.1rem; font-weight: 700; color: var(--white); }
    .modal-close  {
        background: none; border: none; color: var(--mist); font-size: 1.2rem;
        cursor: pointer; padding: .25rem; line-height: 1; transition: color .15s;
    }
    .modal-close:hover { color: var(--cream); }

    /* Form fields inside modal */
    .form-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-field { margin-bottom: 1rem; }
    .form-field label {
        display: block; font-size: .72rem; font-weight: 600;
        letter-spacing: .08em; text-transform: uppercase;
        color: var(--mist); margin-bottom: .45rem;
    }
    .field-input {
        width: 100%; padding: .75rem .9rem;
        background: #141310; border: 1px solid var(--border); border-radius: 9px;
        color: var(--cream); font-family: 'Sora', sans-serif; font-size: .88rem;
        outline: none; transition: border-color .15s;
    }
    .field-input:focus { border-color: var(--flame); }
    .field-input.error { border-color: var(--red); }
    .field-error { font-size: .73rem; color: var(--red); margin-top: .35rem; min-height: 1em; }

    .modal-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel {
        padding: .7rem 1.3rem; background: none; border: 1px solid var(--border);
        border-radius: 9px; color: var(--mist); font-family: 'Sora', sans-serif;
        font-size: .88rem; cursor: pointer; transition: all .15s;
    }
    .btn-cancel:hover { border-color: var(--mist); color: var(--cream); }
    .btn-submit {
        padding: .7rem 1.5rem; background: linear-gradient(135deg, var(--flame), #FF6B35);
        border: none; border-radius: 9px; color: var(--white);
        font-family: 'Sora', sans-serif; font-size: .88rem; font-weight: 600;
        cursor: pointer; transition: opacity .15s;
    }
    .btn-submit:hover:not(:disabled) { opacity: .85; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    /* Delete confirm modal */
    .delete-box { max-width: 380px; text-align: center; }
    .delete-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .delete-msg  { font-size: .9rem; color: var(--cream); line-height: 1.6; margin-bottom: 1.5rem; }
    .delete-msg strong { color: var(--white); }
    .btn-confirm-delete {
        padding: .7rem 1.5rem; background: var(--red); border: none;
        border-radius: 9px; color: var(--white);
        font-family: 'Sora', sans-serif; font-size: .88rem; font-weight: 600;
        cursor: pointer; transition: opacity .15s;
    }
    .btn-confirm-delete:hover:not(:disabled) { opacity: .85; }
    .btn-confirm-delete:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Toast ───────────────────────────────────────── */
    .toast {
        position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 200;
        background: var(--card); border: 1px solid var(--border); border-radius: 10px;
        padding: .8rem 1.2rem; font-size: .85rem; color: var(--cream);
        transform: translateY(6px); opacity: 0; pointer-events: none; transition: all .25s;
    }
    .toast.show    { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast.error   { border-color: rgba(255,59,48,.4); color: #FF6B61; }
    .toast.success { border-color: rgba(52,199,89,.3);  color: var(--green); }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 640px) {
        .form-row { grid-template-columns: 1fr; }
        .col-id, .col-status { display: none; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Sidebar renders here -->
  <div id="sidebar"></div>

  <!-- ── Main Content ───────────────────────────────────── -->
  <main class="main-content">

    <!-- Page header -->
    <div class="header-row">
      <div>
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle">Manage LPG products and stock levels</p>
      </div>

      <!-- Branch toggle -->
      <div class="branch-switcher">
        <span id="viewingBadge" class="branch-view-badge own">Branch A (your branch)</span>
        <button class="branch-btn active" data-branch="1" onclick="switchBranch(1)">Branch A</button>
        <button class="branch-btn"        data-branch="2" onclick="switchBranch(2)">Branch B</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search products..."
          oninput="onSearch()"
        />
      </div>

      <select id="statusFilter" class="filter-select" onchange="loadProducts()">
        <option value="Active">Active only</option>
        <option value="Inactive">Inactive only</option>
        <option value="all">All products</option>
      </select>

      <span class="count-label" id="productCount">— products</span>

      <button class="btn-add" id="addProductBtn" onclick="openAddModal()">
        ＋ Add Product
      </button>
    </div>

    <!-- Products table -->
    <div class="card">
      <table class="products-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Product Name</th>
            <th class="col-price">Price</th>
            <th class="col-stock">Stock</th>
            <th class="col-status">Status</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <tr><td colspan="6" class="table-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- ── Add / Edit Product Modal ──────────────────────────── -->
<div class="modal-backdrop" id="productModal">
  <div class="modal-box">

    <form id="productForm" onsubmit="return false;">

    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Add New Product</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <!-- Product Name (full width) -->
    <div class="form-field">
      <label for="productName">Product Name</label>
      <input type="text" id="productName" class="field-input" placeholder="e.g. LPG 11kg Cylinder" />
      <div class="field-error" id="productNameError"></div>
    </div>

    <!-- Category -->
    <div class="form-field">
      <label for="productCategory">Category</label>
      <select id="productCategory" class="field-input">
        <option value="LPG Cylinder">LPG Cylinder</option>
        <option value="Accessories">Accessories</option>
        <option value="General">General</option>
      </select>
    </div>

    <!-- Price + Stock (two columns) -->
    <div class="form-row">
      <div class="form-field">
        <label for="productPrice">Price (₱)</label>
        <input type="number" id="productPrice" class="field-input" placeholder="0.00" min="0" step="0.01" />
        <div class="field-error" id="productPriceError"></div>
      </div>
      <div class="form-field">
        <label for="productStock">Stock (units)</label>
        <input type="number" id="productStock" class="field-input" placeholder="0" min="0" />
        <div class="field-error" id="productStockError"></div>
      </div>
    </div>

    <!-- Status (only shown when editing) -->
    <div class="form-field" id="statusRow" style="display:none;">
      <label for="productStatus">Status</label>
      <select id="productStatus" class="field-input">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">Add Product</button>
    </div>

    </form>

  </div>
</div>

<!-- ── Delete Confirmation Modal ──────────────────────────── -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal-box delete-box">
    <div class="delete-icon">🗑️</div>
    <p class="delete-msg">
      Remove <strong id="deleteProductName"></strong>?<br />
      This will mark the product as Inactive.<br />
      <small style="color:var(--mist);">Past sales records will not be affected.</small>
    </p>
    <div style="display:flex;gap:.75rem;justify-content:center;">
      <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-confirm-delete" id="confirmDeleteBtn" onclick="executeDelete()">Yes, Remove</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Script order matters -->
<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar.js"></script>
<script src="/BOMS-EVAgas/assets/js/admin/product.js"></script>

</body>
</html>
