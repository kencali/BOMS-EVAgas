<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employees · BOMS Admin</title>
  <link rel="icon" type="image/svg+xml" href="/BOMS-EVAgas/assets/images/boms-favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="/BOMS-EVAgas/assets/css/pages/admin-employees.css" rel="stylesheet" />
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main class="main-content">

    <!-- Page header -->
    <div class="header-row">
      <div>
        <h1 class="page-title">Employees</h1>
        <p class="page-subtitle">Manage employee records and daily rates</p>
      </div>
      <div class="branch-switcher">
        <!-- id="viewingBadge" → read by switchBranch() in employees.js -->
        <span id="viewingBadge" class="branch-view-badge own">Branch A (your branch)</span>
        <button class="branch-btn active" data-branch="1" onclick="switchBranch(1)">Branch A</button>
        <button class="branch-btn"        data-branch="2" onclick="switchBranch(2)">Branch B</button>
      </div>
    </div>

    <!-- Count badges -->
    <!-- id="countActive", id="countInactive" → written by loadEmployees() -->
    <div class="count-row">
      <div class="count-badge active">
        <span>● Active</span>
        <span class="count-num" id="countActive">0</span>
      </div>
      <div class="count-badge inactive">
        <span>○ Inactive</span>
        <span class="count-num" id="countInactive">0</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <!-- id="statusFilter" → read by loadEmployees() on change -->
      <select id="statusFilter" class="filter-select" onchange="loadEmployees()">
        <option value="Active">Active only</option>
        <option value="Inactive">Inactive only</option>
        <option value="all">All employees</option>
      </select>
      <!-- id="employeeCount" → written by loadEmployees() -->
      <span class="count-label" id="employeeCount"></span>
      <!-- id="addEmployeeBtn" → hidden by switchBranch() when viewing other branch -->
      <button class="btn-add" id="addEmployeeBtn" onclick="openAddModal()">
        ＋ Add Employee
      </button>
    </div>

    <!-- Table -->
    <div class="card">
      <table class="employee-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th>Name</th>
            <th>Position</th>
            <th>Daily Rate</th>
            <th>Hire Date</th>
            <th>Status</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <!-- id="employeeTableBody" → written by renderTable() in employees.js -->
        <tbody id="employeeTableBody">
          <tr><td colspan="7" class="table-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- ── Add / Edit Employee Modal ─────────────────────────── -->
<!--
  id="employeeModal"   → opened/closed by openAddModal, openEditModal, closeModal
  id="modalTitle"      → text set by openAddModal / openEditModal
  id="submitBtn"       → text + disabled set by handleSubmit
  id="statusRow"       → display toggled by openAddModal (none) / openEditModal (flex)

  Input IDs (read by handleSubmit, pre-filled by openEditModal):
    fieldFullName, fieldPosition, fieldPhone,
    fieldAddress, fieldHireDate, fieldDailyRate, fieldStatus

  Error IDs (written by setFieldError, cleared by clearFieldErrors):
    errFullName, errPosition, errDailyRate
-->
<div class="modal-backdrop" id="employeeModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Add Employee</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <form onsubmit="return false;">

      <!-- Full Name (full width) -->
      <div class="form-field">
        <label for="fieldFullName">Full Name *</label>
        <input type="text" id="fieldFullName" class="field-input"
               placeholder="e.g. Juan Dela Cruz"/>
        <div class="field-error" id="errFullName"></div>
      </div>

      <!-- Position + Phone -->
      <div class="form-row">
        <div class="form-field">
          <label for="fieldPosition">Position *</label>
          <select id="fieldPosition" class="field-input">
            <option value="Cashier">Cashier</option>
            <option value="Deliverer">Deliverer</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Staff">Staff</option>
            <option value="Driver">Driver</option>
          </select>
          <div class="field-error" id="errPosition"></div>
        </div>
        <div class="form-field">
          <label for="fieldPhone">Phone Number</label>
          <input type="tel" id="fieldPhone" class="field-input"
                 placeholder="09xx-xxx-xxxx"/>
        </div>
      </div>

      <!-- Address (full width) -->
      <div class="form-field">
        <label for="fieldAddress">Address</label>
        <input type="text" id="fieldAddress" class="field-input"
               placeholder="Barangay, Municipality"/>
      </div>

      <!-- Hire Date + Daily Rate -->
      <div class="form-row">
        <div class="form-field">
          <label for="fieldHireDate">Hire Date *</label>
          <input type="date" id="fieldHireDate" class="field-input"/>
        </div>
        <div class="form-field">
          <label for="fieldDailyRate">Daily Rate (₱) *</label>
          <input type="number" id="fieldDailyRate" class="field-input"
                 placeholder="0.00" min="0" step="0.01"/>
          <div class="field-error" id="errDailyRate"></div>
        </div>
      </div>

      <!-- Status (only shown when editing — toggled by openEditModal) -->
      <!-- id="statusRow" → display:none on add, display:flex on edit -->
      <div class="form-field" id="statusRow" style="display:none;">
        <label for="fieldStatus">Status</label>
        <select id="fieldStatus" class="field-input">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel-modal" onclick="closeModal()">Cancel</button>
        <!-- id="submitBtn" → text and disabled toggled by handleSubmit -->
        <button type="button" class="btn-submit" id="submitBtn" onclick="handleSubmit()">
          Add Employee
        </button>
      </div>

    </form>
  </div>
</div>

<!-- ── Deactivate Confirmation Modal ─────────────────────── -->
<!--
  id="deactivateModal"        → opened by confirmDeactivate(), closed by closeDeactivateModal()
  id="deactivateEmployeeName" → text set by confirmDeactivate()
  id="confirmDeactivateBtn"   → disabled + text set by executeDeactivate()
  dataset.id                  → stores employee ID for executeDeactivate()
-->
<div class="modal-backdrop" id="deactivateModal">
  <div class="modal-box small">
    <div class="confirm-icon" data-icon="alert" aria-hidden="true"></div>
    <p class="confirm-msg">
      Deactivate employee<br/>
      <strong id="deactivateEmployeeName"></strong>?<br/>
      <small style="color:var(--mist);">They will no longer appear in active lists.<br/>
      Payroll records are kept intact.</small>
    </p>
    <div style="display:flex;gap:.75rem;justify-content:center;">
      <button class="btn-cancel-modal" onclick="closeDeactivateModal()">Cancel</button>
      <button class="btn-confirm-deactivate"
              id="confirmDeactivateBtn"
              onclick="executeDeactivate()">
        Yes, Deactivate
      </button>
    </div>
  </div>
</div>

<!-- Toast — id="toast" → written by showToast() in employees.js -->
<div class="toast" id="toast"></div>

<!-- Script load order: api → auth → sidebar → page logic -->
<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/icons.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/mobile-navigation.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/date-display.js"></script>
<script src="/BOMS-EVAgas/assets/js/admin/employees.js"></script>
</body>
</html>
