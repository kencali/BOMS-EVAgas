<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales · BOMS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="/BOMS-EVAgas/assets/css/pages/admin-sales.css" rel="stylesheet" />
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>
  <main class="main-content">

    <div class="header-row">
      <div>
        <h1 class="page-title">Sales History</h1>
        <p class="page-subtitle">All sales transactions</p>
      </div>
      <div class="branch-switcher">
        <span id="viewingBadge" class="branch-view-badge own">Branch A (your branch)</span>
        <button class="branch-btn active" data-branch="1" onclick="switchBranch(1)">Branch A</button>
        <button class="branch-btn"        data-branch="2" onclick="switchBranch(2)">Branch B</button>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="summary-row">
      <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value" id="sumRevenue">—</div></div>
      <div class="stat-card"><div class="stat-label">Transactions</div><div class="stat-value" id="sumCount" style="color:var(--white)">—</div></div>
      <div class="stat-card"><div class="stat-label">Avg. Sale</div><div class="stat-value" id="sumAvg" style="color:var(--amber)">—</div></div>
    </div>

    <!-- Date filter -->
    <div class="toolbar">
      <label style="font-size:.78rem;color:var(--mist);">From</label>
      <input type="date" id="dateFrom" class="date-input" />
      <label style="font-size:.78rem;color:var(--mist);">To</label>
      <input type="date" id="dateTo"   class="date-input" />
      <button class="btn-filter" onclick="loadSales()">Apply</button>
      <span style="font-size:.78rem;color:var(--mist);margin-left:auto;" id="salesCount"></span>
    </div>

    <!-- Table -->
    <div class="card">
      <table class="sales-table">
        <thead>
          <tr>
            <th>Sale #</th>
            <th>Date & Time</th>
            <th>Cashier</th>
            <th>Total</th>
            <th>Tendered</th>
            <th>Change</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="salesTableBody">
          <tr><td colspan="7" class="table-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Sale detail modal -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="detailTitle">Sale Detail</h3>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/icons.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/date-display.js"></script>
<script src="/BOMS-EVAgas/assets/js/admin/sales.js"></script>
</body>
</html>
