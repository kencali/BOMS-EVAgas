<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Route Planning · BOMS</title>
  <link rel="icon" type="image/svg+xml" href="/BOMS-EVAgas/assets/images/boms-favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/BOMS-EVAgas/assets/css/light-theme.css">
  <link rel="stylesheet" href="/BOMS-EVAgas/assets/css/pages/routes.css">
</head><body><div class="layout"><div id="sidebar"></div><main class="main-content">
  <div class="header-row"><div><h1 class="page-title">Route Planning</h1><p class="page-subtitle">Plan a road route for one assigned rider. Planning does not start or complete deliveries.</p></div></div>
  <section class="route-toolbar"><label for="riderSelect">Rider <select id="riderSelect" class="route-select"><option value="">Select rider</option></select></label><button id="loadStops" class="btn-load" type="button">Load eligible deliveries</button><button id="planRoute" class="btn-compute" type="button" disabled>Optimize selected stops</button></section>
  <p id="routeMessage" class="route-message">Select a rider to load Pending and On the way deliveries.</p>
  <div class="route-layout"><section class="route-card"><h2>Eligible delivery stops</h2><div id="stopList"></div></section><section class="route-card map-card"><h2>Recommended route</h2><div id="routeSummary">No route planned in this view.</div><div id="routeMap"></div><ol id="routeSequence"></ol></section></div>
</main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/BOMS-EVAgas/assets/js/api.js"></script><script src="/BOMS-EVAgas/assets/js/auth.js"></script><script src="/BOMS-EVAgas/assets/js/components/icons.js"></script><script src="/BOMS-EVAgas/assets/js/components/mobile-navigation.js"></script><script src="/BOMS-EVAgas/assets/js/components/sidebar.js"></script><script src="/BOMS-EVAgas/assets/js/admin/routes.js"></script>
</body></html>
