<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deliveries · BOMS Employee</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--flame:#FF4B1F;--amber:#FF9F0A;--ink:#0F0E0C;--card:#1E1C19;--border:rgba(255,255,255,.07);--mist:#9E9B92;--cream:#F5F0E8;--white:#fff;--green:#34C759;--blue:#5AC8FA;}
    html,body{height:100%;font-family:'Sora',sans-serif;background:var(--ink);color:var(--cream);}
    .header-row,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
    .header-row{margin-bottom:1.5rem;}.page-title{font-size:1.55rem;color:var(--white);}.page-subtitle{font-size:.82rem;color:var(--mist);margin-top:.25rem;}
    .toolbar{margin-bottom:1rem;}.filter-select,.btn-refresh{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--cream);font:inherit;font-size:.8rem;padding:.55rem .8rem;}
    .btn-refresh{cursor:pointer;color:var(--mist);}.btn-refresh:hover{border-color:var(--flame);color:var(--cream);}.count-label{font-size:.78rem;color:var(--mist);margin-left:auto;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:auto;}.delivery-table{width:100%;border-collapse:collapse;min-width:850px;font-size:.82rem;}
    th{text-align:left;padding:.8rem 1rem;color:var(--mist);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border);font-weight:600;}td{padding:.9rem 1rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top;}tr:last-child td{border-bottom:none;}.customer-name{font-weight:600;color:var(--white);}.address,.notes,.date{font-size:.74rem;color:var(--mist);margin-top:.25rem;max-width:220px;}.notes{font-style:italic;}.product{font-weight:600;}.assigned{color:var(--cream);}.unassigned{color:var(--mist);}
    .status-badge{display:inline-block;padding:.25rem .6rem;border-radius:16px;font-size:.7rem;font-weight:600;white-space:nowrap;}.status-pending{background:rgba(255,159,10,.15);color:var(--amber);}.status-otw{background:rgba(90,200,250,.15);color:var(--blue);}.status-delivered{background:rgba(52,199,89,.12);color:var(--green);}.status-cancelled{background:rgba(255,255,255,.06);color:var(--mist);}.empty{padding:3rem;text-align:center;color:var(--mist);}
    .toast{position:fixed;right:1.5rem;bottom:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.75rem 1rem;color:var(--cream);font-size:.82rem;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;}.toast.show{opacity:1;transform:translateY(0);}.toast.error{border-color:rgba(255,59,48,.45);color:#FF6B61;}
    @media(max-width:768px){.main-content{padding:1.25rem;}.count-label{margin-left:0;}.delivery-table{min-width:760px;}}
  </style>
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>
  <main class="main-content">
    <div class="header-row">
      <div><h1 class="page-title">Deliveries</h1><p class="page-subtitle" id="branchLabel">Your branch deliveries</p></div>
      <button class="btn-refresh" onclick="loadDeliveries()">↻ Refresh</button>
    </div>
    <div class="toolbar">
      <select id="statusFilter" class="filter-select" onchange="loadDeliveries()">
        <option value="all">All statuses</option><option value="Pending">Pending</option><option value="On the way">On the way</option><option value="Delivered">Delivered</option><option value="Cancelled">Cancelled</option>
      </select>
      <span class="count-label" id="deliveryCount"></span>
    </div>
    <div class="card">
      <table class="delivery-table"><thead><tr><th>Customer / Address</th><th>Product</th><th>Assigned rider</th><th>Status</th><th>Notes / Date</th></tr></thead><tbody id="deliveryTableBody"><tr><td colspan="5" class="empty">Loading deliveries...</td></tr></tbody></table>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar_employee.js"></script>
<script src="/BOMS-EVAgas/assets/js/employee/deliveries.js"></script>
</body>
</html>
