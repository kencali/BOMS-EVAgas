<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Today's Sales · BOMS Employee</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --flame:#FF4B1F;--amber:#FF9F0A;--ink:#0F0E0C;--card:#1E1C19;
      --border:rgba(255,255,255,.07);--mist:#9E9B92;--cream:#F5F0E8;
      --white:#fff;--green:#34C759;--red:#FF3B30;
    }
    html,body{height:100%;font-family:'Sora',sans-serif;background:var(--ink);color:var(--cream);}
    .page-title{font-size:1.55rem;font-weight:700;color:var(--white);}
    .page-subtitle{font-size:.82rem;color:var(--mist);margin-top:.25rem;}
    .header-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.75rem;}

    /* Summary */
    .summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;}
    .stat-label{font-size:.7rem;color:var(--mist);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.35rem;}
    .stat-value{font-size:1.3rem;font-weight:700;font-family:'Space Mono',monospace;}

    /* Table */
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .sales-table{width:100%;border-collapse:collapse;font-size:.85rem;}
    .sales-table thead th{padding:.85rem 1rem;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);text-align:left;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);}
    .sales-table tbody td{padding:.9rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
    .sales-table tbody tr:last-child td{border-bottom:none;}
    .sales-table tbody tr:hover td{background:rgba(255,255,255,.02);}
    .mono{font-family:'Space Mono',monospace;}
    .table-empty{text-align:center;padding:3rem 1rem;color:var(--mist);}
    .btn-view{padding:.3rem .75rem;border-radius:7px;border:1px solid rgba(90,200,250,.3);color:#5AC8FA;background:rgba(90,200,250,.08);font-family:'Sora',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;}
    .btn-view:hover{background:rgba(90,200,250,.18);}

    /* Detail modal */
    .modal-backdrop{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;}
    .modal-backdrop.open{display:flex;}
    .modal-box{background:#1E1C19;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2rem;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
    .modal-title{font-size:1rem;font-weight:700;color:var(--white);}
    .modal-close{background:none;border:none;color:var(--mist);font-size:1.2rem;cursor:pointer;}
    .detail-row{display:flex;justify-content:space-between;font-size:.83rem;margin-bottom:.4rem;}
    .detail-row .lbl{color:var(--mist);}
    .detail-row .val{font-family:'Space Mono',monospace;color:var(--cream);}
    .detail-divider{border:none;border-top:1px solid var(--border);margin:.75rem 0;}
    .item-row{display:flex;justify-content:space-between;font-size:.82rem;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.04);}
    .item-row:last-child{border-bottom:none;}

    .toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1.2rem;font-size:.85rem;color:var(--cream);transform:translateY(6px);opacity:0;pointer-events:none;transition:all .25s;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.error{border-color:rgba(255,59,48,.4);color:#FF6B61;}
  </style>
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>
  <main class="main-content">

    <div class="header-row">
      <div>
        <h1 class="page-title">Today's Sales</h1>
        <!-- id="todayLabel" → written on DOMContentLoaded -->
        <p class="page-subtitle" id="todayLabel"></p>
      </div>
      <div style="display:flex;gap:.75rem;">
        <a href="/BOMS-EVAgas/public/employee/pos.html"
           style="padding:.55rem 1rem;background:linear-gradient(135deg,var(--flame),#FF6B35);border:none;border-radius:9px;color:var(--white);font-family:'Sora',sans-serif;font-size:.82rem;font-weight:600;text-decoration:none;display:flex;align-items:center;">
          ＋ New Sale
        </a>
        <button onclick="loadOrders()"
                style="padding:.55rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--mist);font-family:'Sora',sans-serif;font-size:.82rem;cursor:pointer;">
          ↻ Refresh
        </button>
      </div>
    </div>

    <!-- Summary stats -->
    <div class="summary-row">
      <div class="stat-card">
        <div class="stat-label">Revenue Today</div>
        <!-- id="statRevenue" → written by loadOrders() -->
        <div class="stat-value" style="color:var(--green);" id="statRevenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Transactions</div>
        <!-- id="statCount" → written by loadOrders() -->
        <div class="stat-value" style="color:var(--white);" id="statCount">—</div>
      </div>
    </div>

    <!-- Sales table -->
    <div class="card">
      <table class="sales-table">
        <thead>
          <tr>
            <th>Sale #</th>
            <th>Time</th>
            <th>Total</th>
            <th>Tendered</th>
            <th>Change</th>
            <th></th>
          </tr>
        </thead>
        <!-- id="ordersTableBody" → written by renderTable() -->
        <tbody id="ordersTableBody">
          <tr><td colspan="6" class="table-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Sale detail modal -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="detailTitle">Sale Detail</h3>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <!-- id="detailBody" → written by viewDetail() -->
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar_employee.js"></script>
<script src="/BOMS-EVAgas/assets/js/employee/orders.js"></script>

</body>
</html>
