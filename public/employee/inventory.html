<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock View · BOMS Employee</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="/BOMS-EVAgas/assets/css/pages/employee-inventory.css" rel="stylesheet" />
  <link href="/BOMS-EVAgas/assets/css/light-theme.css" rel="stylesheet" />
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>

  <main class="main-content">

    <div class="header-row">
      <div>
        <h1 class="page-title">Stock Levels</h1>
        <p class="page-subtitle">Current inventory — read only</p>
      </div>
      <button onclick="loadStock()"
              style="padding:.5rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--mist);font-family:'Sora',sans-serif;font-size:.8rem;cursor:pointer;">
        <span data-icon="refresh" aria-hidden="true"></span> Refresh
      </button>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon" data-icon="search" aria-hidden="true"></span>
        <!-- id="stockSearch" → read by filterStock() on input -->
        <input type="text" id="stockSearch" class="search-input"
               placeholder="Search products..." oninput="filterStock()"/>
      </div>
      <!-- id="stockCount" → written by loadStock() -->
      <span class="count-label" id="stockCount"></span>
    </div>

    <!-- id="stockGrid" → written by renderGrid() -->
    <div class="stock-grid" id="stockGrid">
      <div class="empty-state">Loading...</div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/BOMS-EVAgas/assets/js/api.js"></script>
<script src="/BOMS-EVAgas/assets/js/auth.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/icons.js"></script>
<script src="/BOMS-EVAgas/assets/js/components/sidebar_employee.js"></script>
<script src ="/BOMS-EVAgas/assets/js/employee/inventory.js"></script>

</body>
</html>
